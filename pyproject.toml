[project]
name = "synthetic-data-release"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autodp>=0.2.3.1",
    "category-encoders>=2.9.0",
    "chex>=0.1.91",
    "ctgan @ git+https://github.com/SDC4Society/CTGAN.git",
    "flax>=0.12.6",
    "husl>=4.0.3",
    "jax>=0.9.2",
    "joblib>=1.3.0",
    "k-anonymization",
    "loguru>=0.5.3",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "opacus>=1.5.4",
    "palettable>=3.3.3",
    "pandas>=2.3.3",
    "pynvml>=13.0.1",
    "scikit-learn>=1.6.1",
    "scipy>=1.11.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.16.0",
    "tomli>=2.4.1",
    "tomli-w>=1.2.0",
    "torch>=2.1.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda13]",
    "nvidia-cudnn-cu12",
    "cuml-cu12>=24.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cudf-cu12>=24.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cupy-cuda12x>=13.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
k-anonymization = { git = "https://github.com/SDC4Society/k_anonymization.git", branch = "compatibility/python-3.11" }
cuml-cu12 = { index = "nvidia" }
cudf-cu12 = { index = "nvidia" }
